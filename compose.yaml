services:
  perry:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ros:lyrical-ros-base   # la misma distribución que Phineas y Ferb (Ubuntu 26.04)
    container_name: perry_claw
    network_mode: host
    privileged: true
    volumes:
      - .:/ws
      - /dev:/dev
    environment:
      - PERRY_PORT=/dev/ttyACM0
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # sin "command": el ENTRYPOINT ya es /entrypoint.sh (pasarlo también como comando lo corría dos veces)
