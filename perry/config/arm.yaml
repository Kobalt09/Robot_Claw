# Configuración de Perry. Todo número del brazo vive aquí, no en el código.
# Pulsos en microsegundos (us), como los muestra servo_jog.py.

port: /dev/ttyACM0       # en Windows: Command Port de la Maestro (en la PC de Ignacio salió COM5)

links:                   # cm, de eje a eje (medido el 14-10-2026)
  E1: 3.3                # mesa -> eje del hombro. OJO: las fotos de perfil dan 5–6 cm; volver a medir
  E2: 10.0               # hombro -> codo
  E3: 12.0               # codo -> muñeca
  E45: 10.13             # muñeca -> punta de la pinza cerrada

grip_z: 1.0              # altura de agarre sobre la mesa (cm)
approach_z: 5.0          # cuánto más arriba se acerca antes de bajar (cm)

speed: 20                # velocidad de la Maestro (0 = sin límite)
acceleration: 5
descent_speed: 6         # velocidad del hombro al bajar: con el brazo estirado no alcanza a frenar y golpea

# cal: dos puntos [ángulo, pulso].
joints:
  # base: bajar pulso = izquierda. Tiene ~7° de juego: se llega SIEMPRE desde abajo (pulso - backlash_us).
  # Calibrada por tramos con puntos tocados de verdad (20-10); no es lineal (~11 us/° a la derecha,
  # menos a la izquierda). -36.6° = esquina cercana derecha, +36.6° = esquina cercana izquierda.
  # 31-10: puntos -15/0/+15 corregidos con la prueba de precisión (la base se quedaba corta hasta 2,9° a la izquierda)
  base:   {channel: 0,  cal: [[-36.6, 1915], [-15, 1672], [0, 1491], [15, 1317], [36.6, 1121]], min: 520, max: 2150, backlash_us: 100}
  # hombro/codo/muneca: la cal es PROVISORIA (fotos, ±3°). Para ir a un punto se usa la tabla `reach`.
  # hombro: bajar pulso = hacia adelante, ~6,5 us/° según las fotos de perfil del 20-10
  hombro: {channel: 2,  cal: [[110, 1500], [56, 1200]], min: 500, max: 2500}
  # codo: bajar pulso = abre (se estira)
  codo:   {channel: 4,  cal: [[117, 1100], [76, 1650]], min: 500, max: 2500}
  # muneca: subir pulso = pinza hacia abajo
  muneca: {channel: 6,  cal: [[160, 1500], [118, 1900]], min: 500, max: 2500}
  # giro: 0° = 1447 (dedos cierran de izquierda a derecha con la base a 0°), ~10 us/°.
  # Subir pulso = HORARIO visto desde arriba (comprobado a ojo el 27-10). El 20-10 se invirtió por
  # error mirando la cenital y agarraba los cubos por los vértices.
  giro:   {channel: 8,  cal: [[0, 1447],   [45, 998]], min: 540, max: 2360}   # ±90° probado sin zumbido (27-10)

# pinza: la apertura NO baja de forma pareja con el pulso. Medido 05-11 (cara interna, con las almohadillas
# de 1 mm nuevas): 750 = 2,4 cm; 900 = 2,9; 1000 = 3,2; 1150 = 3,5; máximo ~3,6 cm hacia 1350; después
# se cierra (1700 = cierre firme). Con 750 abría 2,4 cm: sobre un cubo de 1,9 quedaban 2,5 mm por lado
# y un dedo caía sobre la cara de arriba. closed: 2000 (Cristian, 05-11); si zumba al llevar el cubo, 1700.
# push_closed: para EMPUJAR, puntas juntas (~2 mm entre ellas, medido 28-10 sin zumbido)
gripper: {channel: 10, open: 1000, closed: 2000, push_closed: 2350, min: 500, max: 2500}   # open 1000 = 3,2 cm (05-11)

# Cámara cenital. Si la mueven: py calibrate_camera.py (vuelve a marcar las 4 esquinas).
camera:
  index: 0                 # en la PC de Ignacio cambia entre 0 y 1 según qué se conecte primero.
                           # Cada PC puede fijar la suya con la variable PERRY_CAMERA (no toca este archivo);
                           # para ver cuál es la cenital: py list_cameras.py
  max_index: 5             # sin PERRY_CAMERA, si index no abre se prueban 0..max_index-1
  warmup_s: 2.0            # espera para que ajuste la exposición
  # Homografía: 4 esquinas del AZUL de la zona (sin las cintas verdes), en este orden: lejana izq.,
  # lejana der., cercana der., cercana izq.; en píxeles y en cm (X hacia la zona, Y a la izquierda).
  # Los cm se midieron el 31-10 con la calibración de la milimetrada (precisión ~3 mm). Si mueven
  # la cámara: solo cambian corners_px (las esquinas del azul en la imagen nueva).
  # 05-11: la base se corrió 1,8 cm hacia la zona (los cubos que dejan los carros en el borde lejano
  # quedaban fuera de alcance): a cada X se le restó 1,8. Antes: [[21.47, 7.90], [21.19, -8.40], ...].
  corners_px: [[245.0, 137.0], [406.0, 128.0], [409.0, 223.0], [251.0, 232.0]]
  corners_cm: [[19.67, 7.90], [19.39, -8.40], [9.68, -8.02], [9.97, 8.13]]
  zone: {x_min: 8.2, x_max: 20.5, y_abs: 9.5}    # solo se buscan cubos aquí (el azul más un margen)
  height_cm: 70.0          # altura del lente sobre la mesa: corrige la paralaje (la cámara ve la cara
                           # de arriba del cubo y lo ve corrido hacia afuera; fuera del centro, 0,5–1 cm)
  nadir_cm: null           # punto de la mesa bajo la cámara (plomada). null = centro de la imagen
  min_area_px: 150
  colors:                  # rangos HSV de OpenCV (H 0–179)
    azul:     [[[109, 100, 50], [130, 255, 255]]]   # H desde 109: el fondo de la zona azul es H 103-104;
                                                   # los cubos azules, 113-124 (medido 31-10)
    # 05-11: S desde 150 y H hasta 32. La cinta verde de los bordes (H 36–48, S 75–120) entraba como cubo
    # amarillo; el cubo real es H 24–26, S 218–230.
    amarillo: [[[18, 150, 90], [32, 255, 255]]]
    # rojo: cubos trampa que los carros traen por accidente. No tiene caja: Perry los esquiva y avisa.
    # El tono da la vuelta en 0/180 (medido 05-11: H 171–180, S >= 125, V >= 104).
    rojo:     [[[0, 100, 80], [8, 255, 255]], [[165, 100, 80], [179, 255, 255]]]
  zone_bg_hsv: [[98, 150, 80], [108, 255, 255]]   # fondo de la zona azul (H 103-104): lo que no sea esto,
                                                  # dentro del azul, es un objeto (cubo, pala, brazo)

# ASENTANDO (docs/perry_zona_estados.md, sección 4): después de que un carro devuelve la llave, el brazo
# no se mueve hasta que la zona está despejada (sin objeto grande) y quieta, y pasó min_s.
settle:
  min_s: 2.0               # piso: el cubo puede estar rodando todavía
  max_s: 10.0              # si en este tiempo no se despeja (carro trabado), la zona se cierra (BLOCKED)
  big_object_cm2: 20.0     # mancha más grande que esto = carro o brazo (cubo ~3,6; fila de 4 ~14,4).
                           # PROVISORIO: medir con la pala real de Phineas y Ferb
  edge_px: 3               # se ignora este borde del azul (la cinta verde y la línea negra lo ensucian)
  still_tol: 4.0           # diferencia media entre dos cuadros seguidos para decir «quieta» (como wait_still)

# Planificación de agarre con cubos agrupados (grasp.py). Medidas en cm.
grasp:
  cube: 1.9
  finger_thick: 0.6    # 05-11: 0,5 + la almohadilla de 1 mm
  finger_width: 1.9
  opening: 3.2         # apertura con gripper.open = 1000 (medida 05-11). Con 2,9 (900) rozaba la cara de arriba de
                       # cubos girados (~-23°: el giro de la pinza erra unos grados). 3,6 (1350) tolera más
                       # sobre el objetivo, pero los dedos ocupan más lugar al costado. El 4,1 del 27-10 no
                       # se sabe cómo se midió y no tenía las almohadillas
  error: 0.5           # error de posición esperado de la punta
  push: 3.8            # cuánto se desliza una fila al empujarla: 2 cubos, para sacarla del bloque
                       # entera (con 3,0 los cubos se arrastraban entre sí y el 2x2 quedaba escalonado)
  w_giro: 0.3
  w_r: 0.02
  error_lateral: 0.2   # margen a lo ancho de cada dedo (a lo largo sigue siendo error). 05-11: 0,1 dejaba bajar un dedo a 1 mm de un rojo vecino y le pegaba (la pinza erra 3–4 mm); el 31-10, 0,2 bloqueaba (escenas en tests)
                       # cubos con otro pegado a una cara (31-10)
  push_gap: 0.3        # la pinza que empuja baja 0,3 cm más lejos del cubo (no caerle encima)
  behind_gap: 1.0      # 05-11: luz mínima DETRÁS del cubo (más lejos del brazo). Si es menor, primero se separan:
                       # al bajar, el cuerpo de la pinza pegaba en el cubo de atrás (más cerca del borde, inclinada)
  push_dir_step: 30   # empujar también en cualquier dirección (cada 30°), no solo perpendicular a las caras
push_lift_us: 20       # al empujar, la pinza va este tanto (hombro) más alta que al agarrar
push_step_cm: 0.5      # el empuje avanza de a estos cm

# Ciclo automático (sort_cubes.py)
sort:
  same_cube_cm: 1.5        # si tras agarrar hay un cubo a menos de esto del objetivo, el agarre falló
  retries: 1               # reintentos por cubo antes de darlo por perdido
  max_cycles: 12           # tope de vueltas del ciclo (seguridad)
  max_fails_in_a_row: 2   # agarres fallados seguidos -> posible desajuste: se detiene y pide la prueba de precisión
  max_pushes: 3            # tope de empujes SEGUIDOS sin lograr agarrar nada (zona bloqueada)
  push_margin_r: 1.0       # un cubo empujado debe quedar a esto de AMBOS bordes del alcance (mínimo de la tabla y max_r): en cadena se corren mm de más
  log_dir: logs            # fotos y registro de cada corrida (dentro de perry/)
  # Descarte (05-11): los cubos de estos colores no tienen caja. Perry saca primero los que tapan un
  # objetivo y, al terminar, los que queden; los apoya en la mesa en poses.descarte (base), en la postura de
  # agarre a cada una de estas distancias (cm, filas enseñadas), con el hombro discard_lift_us más alto.
  discard_colors: [rojo]
  discard_rs: [16.0, 13.83, 18.06]   # ~2 cm entre lugares: el siguiente rojo no cae encima del anterior
  discard_lift_us: 90      # 1330 a 16 cm, verificado a mano: apoya sin que el cubo rebote

# Posturas enseñadas: la punta toca el papel. r = distancia al eje de la base (cm).
# Origen: poses del Maestro Control Center (20-10) sobre el rectángulo de 16,5 × 8,5 cm
# (X de 11,1 a 19,6 cm). La fila de 21,3 tiene la pinza inclinada. Agregar filas a 12, 18 y 19,5.
reach:
  max_r: 19.5     # LÍMITE DURO (cm): más lejos el hombro no aguanta el brazo estirado y se desploma
                  # (27-10, con el resorte). Coincide con la franja de entrega 12–19,5 cm.
  approach_shoulder_us: 100   # para acercarse: el hombro va hacia atrás esto (la punta sube unos cm)
  grip_shoulder_offset_us: -30  # 27-10: con el resorte nuevo el brazo queda más alto; se baja el hombro esto al agarrar
  rows:
    - {r: 11.91, hombro: 1335, codo: 1604, muneca: 2151}   # cubo real en (11,9; 0,4), agarrado (28-10); pinza levemente inclinada
    - {r: 13.19, hombro: 1323, codo: 1573, muneca: 2097}   # cubo real en (13,1; 1,5), verificado a ojo (27-10)
    - {r: 13.83, hombro: 1321, codo: 1568, muneca: 2088}   # esquinas cercanas
    - {r: 15.35, hombro: 1302, codo: 1521, muneca: 2006}   # centro del rectángulo
    - {r: 16.0,  hombro: 1270, codo: 1426, muneca: 2042}   # primer agarre real de un cubo (20-10)
    # 05-11: se volvió a esta fila. La de {r: 16.5, hombro: 1303, codo: 1428, muneca: 2117} dejaba la pinza
    # 7–10 mm corta entre 15,5 y 16,7 cm (prueba de precisión: error de distancia, no de lado).
    - {r: 18.06, hombro: 1195, codo: 1198, muneca: 2094}   # agarre real en (17,3; -5,2) (20-10)
    - {r: 21.2,  hombro: 1150, codo: 836,  muneca: 2189}   # pinza vertical, punta sobre la mesa (visto en (18,9; 7,3) +1 cm)
    # descartadas: {r: 19.5, hombro: 1200, codo: 1040, muneca: 2130} (se pasaba y empujaba los cubos)
    #              {r: 21.27, hombro: 1263, codo: 667, muneca: 2331} (pinza inclinada; hacía flotar la punta)

# Pose de traslado: brazo alto (punta a ~12 cm) para girar la base sin barrer contenedores ni cubos.
# Todo movimiento sube aquí primero, gira arriba y baja al final. Sin base ni giro: no los toca.
travel: {hombro: 1450, codo: 1300, muneca: 2000}

# Posiciones fijas: pulso por canal (base, hombro, codo, muneca, giro). Cajas del Control Center.
poses:
  vista:    {base: 2100}   # brazo arriba y girado a la derecha: no tapa la zona a la cámara cenital
  # vista_izq: {base: 900}  # DESACTIVADA 31-10: la pinza quedaba casi a la altura del borde de la caja
  #                         # amarilla y al girar hacia la zona la chocó. Falta una pose más alta.
  inicio:   {base: 1479, hombro: 1400, codo: 1521, muneca: 2006, giro: 1447}
  # 05-11: las cajas se pusieron en horizontal y cambiaron de lado (verde a la izquierda, amarilla a la
  # derecha). Se suelta desde la pose de traslado (brazo alto); solo cambia la base. Antes:
  #   amarillo: {base: 865,  hombro: 1244, codo: 737, muneca: 2496, giro: 2059}  (izquierda)
  #   verde:    {base: 2079, hombro: 1244, codo: 737, muneca: 2496, giro: 952}   (derecha)
  amarillo: {base: 2150}   # caja derecha: es el tope de la base (verificado con el brazo, sin zumbido)
  verde:    {base: 979}    # caja izquierda (verificado con el brazo)
  # descarte de cubos sin caja (rojos), sobre la mesa más allá de la caja verde, con la base en el tope
  # izquierdo. Las posturas salen de sort.discard_rs (05-11: a 16 cm, hombro 1330, verificado a mano).
  descarte: {base: 520, giro: 1447}

# Tolerancia y estabilización para verificar posición de reposo (Fase 1: reach.py)
park_tolerance_us: 30     # margen aceptable (±us) en travel y base para declarar reposo
park_settle_s: 0.5        # espera tras moverse a vista para evitar vibración

# A qué contenedor va cada color.
containers: {azul: amarillo, amarillo: verde}   # 27-10: cubos azules -> caja amarilla, amarillos -> caja verde

# Prueba de precisión (precision.py / botón del panel): un cubo se deja en estos puntos y la cámara
# mide dónde quedó. Lugo obtuvo ~1,2 mm de error medio con su brazo.
precision:
  points: [[13.0, 0.0], [16.0, 0.0], [17.5, 0.0], [16.0, 5.0], [16.0, -5.0]]   # 18,5 era demasiado al borde (31-10)
  threshold_cm: 0.5        # error cuadrático medio aceptable; más = recalibrar
  place_lift_us: 10        # al soltar, el hombro queda este tanto más alto que al agarrar (no aplastar)
  max_turn_deg: 15         # si el cubo gira más que esto al cerrar, la medición se descarta
  lost_cm: 4.0             # si el cubo aparece más lejos que esto del punto, se da por perdido

# Control y automatización de flota (Fase 5)
auto_sort_on_release: true     # inicia ciclo automáticamente cuando un carro llama /zone/release
fleet:                         # turnos de la zona (plan de integración del 02-11, puntos 5.2 y 5.4)
  full_cubes: 2                # con tantos cubos alcanzables esperando: zona llena, gate_closed («no traigan»)
  queue_ttl_s: 3.0             # un carro que deja de pedir la llave este tiempo pierde su lugar en la cola
blocked_check_interval_s: 3.0  # tiempo (segundos) entre chequeos automáticos de zona bloqueada
